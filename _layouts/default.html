<!DOCTYPE html>
<html lang="en">
  {% include head.html %}

  <body>
    <div class="container content">
      <header class="site-header">
        <a class="site-name" href="{{ '/' | relative_url }}" title="Home">Rohan Kalbag</a>
        <div class="header-actions">
          <nav class="nav" id="primary-navigation" aria-label="Primary navigation">
            {% for nav in site.nav %}
            {% if nav.url contains '://' %}
            <a href="{{ nav.url }}">{{ nav.title }}</a>
            {% else %}
            <a href="{{ nav.url | relative_url }}"{% if page.url == nav.url or page.url == nav.url | append: '/' %} aria-current="page"{% endif %}>{{ nav.title }}</a>
            {% endif %}
            {% endfor %}
          </nav>
          <button class="theme-toggle" type="button" data-theme-toggle aria-label="Switch colour theme">
            <span class="theme-toggle-track" aria-hidden="true"><span class="theme-toggle-thumb"></span></span>
            <span class="visually-hidden" data-theme-label>Dark</span>
          </button>
          <button class="menu-toggle" type="button" data-menu-toggle aria-controls="primary-navigation" aria-expanded="false">
            <span class="menu-toggle-lines" aria-hidden="true"><span></span><span></span><span></span></span>
            <span class="visually-hidden">Toggle navigation</span>
          </button>
        </div>
      </header>

      <main>
        {{ content }}
      </main>

      <footer class="footer">
        <p class="footer-links"><a href="https://www.github.com/rohankalbag">GitHub</a><a href="https://www.linkedin.com/in/rohanrkalbag/">LinkedIn</a><a href="mailto:kalbag.rohan.r@gmail.com">Email</a></p>
        <small>© <span id="current-year"></span> Rohan Kalbag.</small>
      </footer>
    </div>

    {% if site.ga_analytics %}
    <script>
      (function (i, s, o, g, r, a, m) {
        i["GoogleAnalyticsObject"] = r;
        (i[r] =
          i[r] ||
          function () {
            (i[r].q = i[r].q || []).push(arguments);
          }),
          (i[r].l = 1 * new Date());
        (a = s.createElement(o)), (m = s.getElementsByTagName(o)[0]);
        a.async = 1;
        a.src = g;
        m.parentNode.insertBefore(a, m);
      })(
        window,
        document,
        "script",
        "https://www.google-analytics.com/analytics.js",
        "ga"
      );
      ga("create", "{{ site.ga_analytics }}", "auto");
      ga("send", "pageview");
    </script>
    {% endif %}
    <script>
      document.getElementById("current-year").textContent = new Date().getFullYear();

      (function () {
        var toggle = document.querySelector("[data-theme-toggle]");
        var label = document.querySelector("[data-theme-label]");

        function updateToggle() {
          var isDark = document.documentElement.dataset.theme === "dark";
          toggle.setAttribute("aria-pressed", String(isDark));
          toggle.setAttribute("aria-label", isDark ? "Switch to light mode" : "Switch to dark mode");
          label.textContent = isDark ? "Dark" : "Light";
        }

        toggle.addEventListener("click", function () {
          var nextTheme = document.documentElement.dataset.theme === "dark" ? "light" : "dark";
          document.documentElement.dataset.theme = nextTheme;
          localStorage.setItem("theme", nextTheme);
          updateToggle();
        });

        updateToggle();
      }());

      (function () {
        var menuToggle = document.querySelector("[data-menu-toggle]");
        var navigation = document.getElementById("primary-navigation");

        function setMenu(open) {
          navigation.classList.toggle("is-open", open);
          menuToggle.setAttribute("aria-expanded", String(open));
        }

        menuToggle.addEventListener("click", function () {
          setMenu(!navigation.classList.contains("is-open"));
        });

        navigation.querySelectorAll("a").forEach(function (link) {
          link.addEventListener("click", function () { setMenu(false); });
        });

        document.addEventListener("keydown", function (event) {
          if (event.key === "Escape") setMenu(false);
        });
      }());
    </script>
  </body>
</html>
